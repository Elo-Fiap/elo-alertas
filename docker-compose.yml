# Só o Postgres do serviço. Porta do host 54340 para não colidir com outros bancos locais.
services:
  banco:
    image: postgres:17-alpine
    container_name: elo-alertas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elo
      POSTGRES_PASSWORD: elo_local
      POSTGRES_DB: elo_alertas
    ports:
      - "54340:5432"
    volumes:
      - elo_alertas_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elo -d elo_alertas"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  elo_alertas_dados:
